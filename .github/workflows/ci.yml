# Quality gates — the same checks SETUP.md and README tell contributors to
# run locally. Every PR and every push to main must pass all four.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the previous run for that PR — saves minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
